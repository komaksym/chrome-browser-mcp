name: Refresh lockfile once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/chatgpt-agent-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-agent-registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm audit --audit-level=high
      - name: Commit refreshed lock and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git rm .github/workflows/refresh-lock-once.yml
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:fix/chatgpt-agent-registry
