name: Apply version plumbing once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/versioned-extension-refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/versioned-extension-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire package version into MCP runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/bridge/mcpServer.ts')
          text = path.read_text()
          text = text.replace(
              'import type { Server as HttpServer } from "node:http";',
              'import { readFileSync } from "node:fs";\nimport type { Server as HttpServer } from "node:http";',
              1,
          )
          text = text.replace(
              'const contentWarning =',
              'const packageVersion = (JSON.parse(readFileSync(new URL("../../package.json", import.meta.url), "utf8")) as { version: string }).version;\n\nconst contentWarning =',
              1,
          )
          text = text.replace(
              '{ name: "chrome-browser-mcp", version: "0.1.0" },',
              '{ name: "chrome-browser-mcp", version: packageVersion },',
              1,
          )
          text = text.replace(
              '() => asToolResult({ ...browser.status(), writeEnabled: true }),',
              '() => asToolResult({ ...browser.status(), mcpVersion: packageVersion, writeEnabled: true }),',
              1,
          )
          path.write_text(text)
          PY
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit runtime version plumbing
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bridge/mcpServer.ts package-lock.json
          git rm .github/workflows/apply-version-plumbing-once.yml
          git commit -m "fix: expose synchronized Chrome MCP versions"
          git push origin HEAD:fix/versioned-extension-refresh
