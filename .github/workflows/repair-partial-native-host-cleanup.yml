name: Repair partial native host cleanup

on:
  push:
    branches:
      - issue-36-live-smoke-env

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch partial provisioning rollback and remove helper
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='cd45682f427323564ab142b6c4e8b1d702b3e9ff'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            echo "Unexpected helper parent: $actual_parent" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/support/chrome-mcp-stack.mjs')
          text = path.read_text()
          function_start = text.index('async function installNativeHostManifests')
          start_marker = '  for (const [index, directory] of directories.entries()) {'
          start = text.index(start_marker, function_start)
          end_marker = '\n}\n\nasync function findExistingNativeHostManifest'
          end = text.index(end_marker, start)
          install_tail = text[start:end]
          if 'async restore()' not in install_tail or 'await writeFile(path, manifest);' not in install_tail:
              raise SystemExit('Unexpected installNativeHostManifests tail; refusing to patch')

          new_tail = '''  const restorePaths = async (pathsToRestore) => {
            for (const path of pathsToRestore) {
              const previousManifest = previous.get(path);
              if (previousManifest === undefined) await unlink(path).catch(() => undefined);
              else await writeFile(path, previousManifest);
            }
          };
          const touchedPaths = [];
          try {
            for (const [index, directory] of directories.entries()) {
              const path = paths[index];
              try {
                previous.set(path, await readFile(path, "utf8"));
              } catch (error) {
                if (error?.code !== "ENOENT") throw error;
                previous.set(path, undefined);
              }
              touchedPaths.push(path);
              await mkdir(directory, { recursive: true });
              await writeFile(path, manifest);
            }
          } catch (error) {
            await restorePaths(touchedPaths);
            throw error;
          }

          return {
            paths,
            restore: () => restorePaths(paths),
          };'''

          updated = text[:start] + new_tail + text[end:]
          if updated.count('const restorePaths = async (pathsToRestore) => {') != 1:
              raise SystemExit('Rollback helper insertion assertion failed')
          if 'async restore()' in updated[function_start:updated.index(end_marker, function_start)]:
              raise SystemExit('Old restore implementation still present')
          path.write_text(updated)
          PY

          git rm .github/workflows/repair-partial-native-host-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/support/chrome-mcp-stack.mjs
          git diff --cached --check
          git commit -m 'fix: roll back partial native host provisioning'
          git push origin HEAD:issue-36-live-smoke-env
