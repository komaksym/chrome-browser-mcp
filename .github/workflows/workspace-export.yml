name: Finalize Issue 47 Branch
on:
  push:
    branches:
      - feat/issue-47-auto-close-worker-tabs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply verified implementation patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/issue47.patch
          git apply --check /tmp/issue47.patch
          git apply /tmp/issue47.patch
          npm install --package-lock-only --ignore-scripts --no-audit
          npm run build
          rm .github/workflows/workspace-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: auto-close verified worker tabs'
      - name: Verify finalized tree
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run artifacts:check
          npm run audit
      - name: Push finalized branch
        run: git push origin HEAD:feat/issue-47-auto-close-worker-tabs
