name: Generate runtime artifacts

on:
  push:
    branches:
      - fix/issue-26-worker-tab-removal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-artifacts
          path: dist/
          if-no-files-found: error
