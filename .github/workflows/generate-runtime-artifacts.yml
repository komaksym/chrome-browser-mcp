name: Generate runtime artifacts

on:
  push:
    branches:
      - fix/issue-26-worker-tab-removal

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-26-worker-tab-removal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated runtime artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Runtime artifacts already synchronized"
            exit 0
          fi
          git commit -m "chore: regenerate runtime artifacts"
          git push origin HEAD:fix/issue-26-worker-tab-removal
