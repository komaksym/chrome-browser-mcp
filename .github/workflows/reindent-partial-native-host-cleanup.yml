name: Reindent partial native host cleanup

on:
  push:
    branches:
      - issue-36-live-smoke-env

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reindent rollback and remove helper
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='00a63b95608a1cae4816c9c15b7e38ad82c7a606'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            echo "Unexpected helper parent: $actual_parent" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/support/chrome-mcp-stack.mjs')
          text = path.read_text()
          function_start = text.index('async function installNativeHostManifests')
          start = text.index('  const restorePaths = async (pathsToRestore) => {', function_start)
          end_marker = '\n}\n\nasync function findExistingNativeHostManifest'
          end = text.index(end_marker, start)
          lines = [
              '  const restorePaths = async (pathsToRestore) => {',
              '    for (const path of pathsToRestore) {',
              '      const previousManifest = previous.get(path);',
              '      if (previousManifest === undefined) await unlink(path).catch(() => undefined);',
              '      else await writeFile(path, previousManifest);',
              '    }',
              '  };',
              '  const touchedPaths = [];',
              '  try {',
              '    for (const [index, directory] of directories.entries()) {',
              '      const path = paths[index];',
              '      try {',
              '        previous.set(path, await readFile(path, "utf8"));',
              '      } catch (error) {',
              '        if (error?.code !== "ENOENT") throw error;',
              '        previous.set(path, undefined);',
              '      }',
              '      touchedPaths.push(path);',
              '      await mkdir(directory, { recursive: true });',
              '      await writeFile(path, manifest);',
              '    }',
              '  } catch (error) {',
              '    await restorePaths(touchedPaths);',
              '    throw error;',
              '  }',
              '',
              '  return {',
              '    paths,',
              '    restore: () => restorePaths(paths),',
              '  };',
          ]
          updated = text[:start] + '\n'.join(lines) + text[end:]
          if updated == text:
              raise SystemExit('Expected formatting change did not occur')
          path.write_text(updated)
          PY

          git rm .github/workflows/reindent-partial-native-host-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/support/chrome-mcp-stack.mjs
          git diff --cached --check
          git commit -m 'style: indent native host rollback'
          git push origin HEAD:issue-36-live-smoke-env
