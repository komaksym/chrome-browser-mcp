name: Build agent reliability patch

on:
  push:
    branches:
      - fix/agent-result-identity

permissions:
  contents: write

jobs:
  build-and-commit:
    if: "${{ github.event.head_commit.message == 'ci: build agent reliability patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx playwright install chromium
      - name: Real Chromium E2E
        run: |
          sudo mkdir -p /etc/chromium/native-messaging-hosts /etc/opt/chrome/native-messaging-hosts
          sudo chmod 777 /etc/chromium/native-messaging-hosts /etc/opt/chrome/native-messaging-hosts
          CHROME_NATIVE_HOST_DIRS="/etc/chromium/native-messaging-hosts:/etc/opt/chrome/native-messaging-hosts" npm run test:e2e
      - name: Bump and build exact runtime artifacts
        run: |
          npm version 0.1.8 --no-git-tag-version
          sed -i 's/0\.1\.7/0.1.8/g' README.md
          npm run build
      - name: Commit generated patch
        run: |
          git config user.name "ChatGPT Implementation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json README.md dist
          git commit -m "chore: generate 0.1.8 runtime artifacts"
          npm run version:check
          npm run artifacts:check
          git push origin HEAD:fix/agent-result-identity
