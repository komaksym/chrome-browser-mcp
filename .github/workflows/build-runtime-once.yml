name: Build tracked runtime once
on:
  push:
    branches: [fix/pull-updates-runtime-artifacts]
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'komaksym/chrome-browser-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pull-updates-runtime-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit runtime and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git rm .github/workflows/build-runtime-once.yml
          git commit -m "build: track Chrome MCP runtime artifacts"
          git push
