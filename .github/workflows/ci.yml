name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: chmod +x scripts/*.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run artifacts:check
      - run: npm audit --audit-level=high
