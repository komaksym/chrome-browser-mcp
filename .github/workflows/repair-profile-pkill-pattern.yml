name: Repair profile cleanup pattern

on:
  push:
    branches:
      - issue-36-live-smoke-env

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Escape profile cleanup regex and remove helper
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='15b8884b976808a0d15cb65816219817898e9030'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            echo "Unexpected helper parent: $actual_parent" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/support/chrome-mcp-stack.mjs')
          text = path.read_text()
          marker = 'async function stopBrowserProcess(browserProcess, profileDir) {'
          if text.count(marker) != 1:
              raise SystemExit('Unexpected stopBrowserProcess marker count')
          helper = '\n'.join([
              'export function profileProcessPattern(profileDir) {',
              '  const escaped = profileDir.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");',
              '  return `--user-data-dir=${escaped}`;',
              '}',
              '',
              marker,
          ])
          text = text.replace(marker, helper, 1)

          old_term = '    spawnSync("pkill", ["-TERM", "-f", `--user-data-dir=${profileDir}`], { stdio: "ignore" });'
          new_term = '\n'.join([
              '    const processPattern = profileProcessPattern(profileDir);',
              '    spawnSync("pkill", ["-TERM", "-f", processPattern], { stdio: "ignore" });',
          ])
          old_kill = '    spawnSync("pkill", ["-KILL", "-f", `--user-data-dir=${profileDir}`], { stdio: "ignore" });'
          new_kill = '    spawnSync("pkill", ["-KILL", "-f", processPattern], { stdio: "ignore" });'
          if text.count(old_term) != 1 or text.count(old_kill) != 1:
              raise SystemExit('Unexpected pkill call shape; refusing to patch')
          text = text.replace(old_term, new_term, 1).replace(old_kill, new_kill, 1)
          path.write_text(text)
          PY

          git rm .github/workflows/repair-profile-pkill-pattern.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/support/chrome-mcp-stack.mjs
          git diff --cached --check
          git commit -m 'fix: escape profile cleanup process match'
          git push origin HEAD:issue-36-live-smoke-env
