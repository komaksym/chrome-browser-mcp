name: Sync PR runtime artifacts
on:
  push:
    branches:
      - fix/10-recover-finished-agent-results
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10-recover-finished-agent-results
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated runtime artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild runtime artifacts"
            git push origin HEAD:fix/10-recover-finished-agent-results
          fi
