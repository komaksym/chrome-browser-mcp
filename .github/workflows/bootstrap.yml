name: Publish tested source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify archive
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* > /tmp/chrome-browser-mcp.zip.b64
          base64 --decode /tmp/chrome-browser-mcp.zip.b64 > /tmp/chrome-browser-mcp.zip
          echo "def9d71356eb9e09d6dbb7ee234cf8591f8b4ae945f56e4337cf294ad6e263c5  /tmp/chrome-browser-mcp.zip" | sha256sum --check
          unzip -oq /tmp/chrome-browser-mcp.zip -d .

      - name: Remove bootstrap artifacts
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          chmod +x scripts/*.sh

      - name: Commit tested source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish tested Chrome Browser MCP v0.1.0"
          git push origin HEAD:main
